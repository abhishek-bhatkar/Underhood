<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17120e" />
    <meta
      name="description"
      content="Interactive, step-by-step simulations of Docker, Kubernetes, Kafka, the JVM, Linux, networking, databases, V8, and system design. Play each event, inspect every component, replay every failure."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Underhood — watch technical systems actually work" />
    <meta
      property="og:description"
      content="Don't just read how it works. Watch it work: playable simulations of nine systems, from docker run to the JIT."
    />
    <meta property="og:url" content="https://abhishek-bhatkar.github.io/Underhood/" />
    <title>Underhood — watch technical systems actually work</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong mode.
      try {
        var t = localStorage.getItem('underhood-theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
