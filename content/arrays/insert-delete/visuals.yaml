nodes:
  - id: array
    kind: array
    label: Array
    position: { x: 0, y: 0 }
    size: { w: 820, h: 230 }
    key: cells
    itemTemplate: "$value"
    pointerKey: index
    handles:
      - { id: out, type: source, pos: right }
  - id: operation
    kind: panel
    label: Operation
    position: { x: 0, y: 300 }
    size: { w: 390, h: 190 }
    lines:
      - "from → to · $value"
      - "shifts · writes · deletes"
      - "insert · delete"
    handles:
      - { id: in, type: target, pos: top }
  - id: complexity
    kind: panel
    label: Complexity
    position: { x: 450, y: 300 }
    size: { w: 370, h: 190 }
    lines:
      - "beginning/middle · O(n)"
      - "end · O(1)"
      - "extra space · O(1)"
    handles:
      - { id: in, type: target, pos: top }
edges:
  - { source: array, from: out, target: operation, to: in }
  - { source: array, from: out, target: complexity, to: in }
