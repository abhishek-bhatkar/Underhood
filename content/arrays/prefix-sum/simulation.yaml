scenarios:
  - id: full-range
    name: Build and query the full range
    components: [{ id: array }, { id: prefix }, { id: range }, { id: complexity }]
    events:
      - type: ARRAY_READY
        explanation: { title: Prepare the input, body: The values 3, 1, 4, 2, and 5 are ready for cumulative addition. }
        effects:
          - { op: set, component: array, data: { cells: [{ value: 3 }, { value: 1 }, { value: 4 }, { value: 2 }, { value: 5 }], left: 0, right: 4 } }
          - { op: set, component: prefix, data: { values: [0], index: 0, running: 0 } }
          - { op: set, component: complexity, data: { build: O(n), query: O(1), space: O(n) } }
      - type: PREFIX_BUILD
        payload: { index: 0, running: 3 }
        explanation: { title: Add 3, body: Prefix index 1 stores zero plus the first input value. }
        effects: [{ op: set, component: prefix, data: { values: [0, 3], index: 1, running: 3 } }]
      - type: PREFIX_BUILD
        payload: { index: 1, running: 4 }
        explanation: { title: Add 1, body: "The next prefix extends the previous total: 3 plus 1 equals 4." }
        effects: [{ op: set, component: prefix, data: { values: [0, 3, 4], index: 2, running: 4 } }]
      - type: PREFIX_BUILD
        payload: { index: 2, running: 8 }
        explanation: { title: Add 4, body: The cumulative total becomes 8 after including the third input value. }
        effects: [{ op: set, component: prefix, data: { values: [0, 3, 4, 8], index: 3, running: 8 } }]
      - type: PREFIX_BUILD
        payload: { index: 3, running: 10 }
        explanation: { title: Add 2, body: The cumulative total becomes 10 after including the fourth input value. }
        effects: [{ op: set, component: prefix, data: { values: [0, 3, 4, 8, 10], index: 4, running: 10 } }]
      - type: PREFIX_BUILD
        payload: { index: 4, running: 15 }
        explanation: { title: Add 5, body: The final prefix stores the total of the complete input array. }
        effects: [{ op: set, component: prefix, data: { values: [0, 3, 4, 8, 10, 15], index: 5, running: 15 } }]
      - type: RANGE_QUERY
        payload: { left: 0, right: 4, before: 0, after: 15 }
        explanation: { title: Query the full range, body: "Subtract prefix[0] from prefix[5] to retain every input value." }
        effects: [{ op: set, component: range, data: { left: 0, right: 4, before: 0, after: 15 } }]
      - type: RANGE_SUM_COMPLETE
        payload: { left: 0, right: 4, sum: 15 }
        explanation: { title: Full range sum is 15, body: "prefix[5] minus prefix[0] equals 15 in one query step.", concept: Prefix boundaries turn a range sum into one subtraction. }
        effects:
          - { op: status, component: prefix, status: done }
          - { op: status, component: range, status: done }
          - { op: set, component: range, data: { left: 0, right: 4, sum: 15, query: full range } }
          - { op: log, text: "full range sum: 15" }
  - id: normal-range
    name: Answer a middle range query
    components: [{ id: array }, { id: prefix }, { id: range }, { id: complexity }]
    events:
      - type: ARRAY_READY
        explanation: { title: Prepare values, body: Build prefixes before answering a range query from index 1 through 3. }
        effects:
          - { op: set, component: array, data: { cells: [{ value: 3 }, { value: 1 }, { value: 4 }, { value: 2 }, { value: 5 }] } }
          - { op: set, component: prefix, data: { values: [0] } }
          - { op: set, component: complexity, data: { build: O(n), query: O(1), space: O(n) } }
          - { op: log, text: "prefix preprocessing started" }
      - type: PREFIX_BUILD
        explanation: { title: Build prefix values, body: Each prefix stores the total through that index. }
        effects: [{ op: set, component: prefix, data: { values: [0, 3, 4, 8, 10, 15], index: 5 } }]
      - type: PREFIX_READY
        explanation: { title: Prefix table ready, body: The preprocessed totals can now answer any range with two endpoint lookups. }
        effects: [{ op: log, text: "prefix table ready for range query" }]
      - type: RANGE_QUERY
        payload: { left: 1, right: 3, before: 3, after: 10 }
        explanation: { title: Query indexes 1 through 3, body: "Subtract prefix[1] from prefix[4] to isolate the range." }
        effects: [{ op: set, component: range, data: { left: 1, right: 3, before: 3, after: 10 } }]
      - type: RANGE_SUM_COMPLETE
        payload: { left: 1, right: 3, sum: 7 }
        explanation: { title: Range sum is 7, body: "prefix[4] minus prefix[1] equals 7." }
        effects:
          - { op: set, component: range, data: { left: 1, right: 3, sum: 7, query: "sum(1..3)" } }
          - { op: status, component: prefix, status: done }
          - { op: status, component: range, status: done }
          - { op: status, component: complexity, status: done }
          - { op: log, text: "range sum(1..3): 7" }
          - { op: status, component: complexity, status: done }
