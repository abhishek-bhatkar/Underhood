concepts:
  terminal:
    name: Terminal (psql)
    summary: "The SQL client — ships text, formats rows."
    fields:
      - { key: command, label: query }
    details:
      - "The server receives the query as an opaque string over the connection."
      - "EXPLAIN shows the plan this pipeline chose — ANALYZE runs it."

  parser:
    name: Parser
    summary: "Text → parse tree, with syntax and catalog checks."
    details:
      - "Lexing, grammar, and a semantic pass against system catalogs."
      - "Errors here are syntax/unknown-identifier failures."
      - "The parse tree says what, never how."

  planner:
    name: Planner
    summary: "Cost-based chooser of execution plans."
    fields:
      - { key: plan, label: chosen plan }
    details:
      - "Enumerates plans (index vs seq scan, join orders) and costs them."
      - "Costs come from table statistics (pg_statistic) — stale stats, bad plans."
      - "The plan is a tree of executor nodes: Scan, Join, Sort, Aggregate…"

  executor:
    name: Executor
    summary: "Runs the plan tree — a pipeline of nodes pulling tuples."
    details:
      - "Volcano model: each node asks the one below for the next tuple."
      - "Applies filters, projections, and checks MVCC visibility."
      - "For updates: lock, write new version, log to WAL."

  index:
    name: "Index (B-tree)"
    summary: "Ordered structure mapping keys to row ctids."
    fields:
      - { key: descent, label: descent, list: true }
    details:
      - "Descent is a few page reads: root → internal → leaf."
      - "Leaves hold (key, ctid); the heap tuple lives elsewhere."
      - "Indexes slow writes and speed reads — the planner decides when they pay off."

  pages:
    name: Heap pages
    summary: "The table's actual storage — pages of tuple slots."
    fields:
      - { key: heap, label: tuples, list: true }
    details:
      - "8 KB pages; tuples addressed as (page, slot) ctids."
      - "Updates write new versions; vacuum later reclaims dead ones."
      - "Rows are never updated in place under MVCC."

  buffer-pool:
    name: Buffer pool
    summary: "Shared-memory cache of 8 KB pages — every access goes through it."
    fields:
      - { key: cached, label: cached, list: true }
    details:
      - "Hit: served from RAM. Miss: read from tablespace and pinned."
      - "shared_buffers sizing is a top PostgreSQL knob."
      - "Dirty pages flush to disk lazily — WAL ordering protects them."

  wal:
    name: WAL
    summary: "Write-ahead log: sequential, durable, replayable."
    fields:
      - { key: records, label: records, list: true }
      - { key: flushed, label: flushed }
    details:
      - "Physical change records appended before data pages are dirtied."
      - "COMMIT fsyncs the log — that fsync IS durability."
      - "Crash recovery replays WAL to reconstruct exactly the committed state."
