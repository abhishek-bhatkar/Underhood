# Docker run nginx — event sequences as data.
# State transitions are declarative `effects` interpreted by the engine.
scenarios:
  - id: pull
    name: Pull image
    components:
      - id: terminal
      - id: cli
      - id: daemon
      - id: registry
      - id: image-store
      - id: container
        initial: absent
    events:
      - type: COMMAND_ENTERED
        source: terminal
        target: cli
        duration: 1200
        payload:
          command: docker run nginx
        explanation:
          title: "You run: docker run nginx"
          body: >-
            You type the command in your terminal. The Docker CLI parses the
            arguments: image "nginx", no explicit name, default tag "latest".
            The CLI itself doesn't create anything — it is a thin client that
            will ask the Docker daemon to do the work.
          concept: >-
            docker run is shorthand for two API calls: create a container,
            then start it.
        effects:
          - op: set
            component: terminal
            data: { command: "$payload.command" }
          - op: status
            component: terminal
            status: done
          - op: status
            component: cli
            status: active
          - op: label
            component: cli
            text: parsing command
          - op: log
            text: "$ $payload.command"

      - type: CLI_REQUEST
        source: cli
        target: daemon
        duration: 1000
        payload:
          method: POST
          path: /v1.47/containers/create
        explanation:
          title: "The CLI calls the daemon's HTTP API"
          body: >-
            The CLI connects to the daemon over a local Unix socket
            (/var/run/docker.sock) and sends a REST request describing the
            desired container: image, env, ports, command. Docker is a
            client/server program — the CLI is just one possible client.
          concept: >-
            The CLI is not the container. The daemon (dockerd) performs all
            the work.
        effects:
          - op: status
            component: cli
            status: active
          - op: label
            component: cli
            text: "$payload.method $payload.path"
          - op: status
            component: daemon
            status: active
          - op: label
            component: daemon
            text: handling API request
          - op: log
            text: "cli -> daemon: $payload.method $payload.path"

      - type: IMAGE_LOOKUP
        source: daemon
        target: image-store
        duration: 900
        payload:
          image: nginx:latest
        explanation:
          title: The daemon looks for the image locally
          body: >-
            Before touching the network, the daemon checks its local content
            store: is there an image named nginx:latest on this machine?
            Images are stored as content-addressed layers, not single files.
          concept: Local first — the daemon only pulls from a registry if the image is missing.
        effects:
          - op: status
            component: daemon
            status: active
          - op: label
            component: daemon
            text: "checking local image store…"
          - op: status
            component: image-store
            status: active
          - op: log
            text: "daemon: looking for image locally"

      - type: IMAGE_MISS
        source: image-store
        target: daemon
        duration: 700
        payload:
          reason: not-found
        explanation:
          title: "Not found: Unable to find image locally"
          body: >-
            This machine has never pulled nginx, so there is nothing to run
            yet. Docker prints the familiar message and transparently falls
            back to pulling the image from a registry — no separate
            "docker pull" needed.
          concept: docker run = pull (if needed) + create + start.
        effects:
          - op: status
            component: image-store
            status: idle
          - op: label
            component: daemon
            text: image not found locally
          - op: log
            text: "Unable to find image 'nginx:latest' locally"

      - type: REGISTRY_REQUEST
        source: daemon
        target: registry
        duration: 1000
        payload:
          registry: registry-1.docker.io
        explanation:
          title: "Contacting the registry: registry-1.docker.io"
          body: >-
            The daemon authenticates to Docker Hub, resolves the tag nginx
            (short for nginx:latest) to an immutable digest, and asks for the
            image manifest — the index that lists every layer the image needs.
          concept: >-
            A registry stores manifests and layer blobs, each addressed by
            the SHA-256 of its content.
        effects:
          - op: label
            component: daemon
            text: contacting registry
          - op: status
            component: registry
            status: active
          - op: label
            component: registry
            text: "auth + manifest"
          - op: log
            text: "daemon -> $payload.registry: auth, fetch manifest"

      - type: MANIFEST_FETCHED
        source: registry
        target: daemon
        duration: 700
        payload:
          layers: 4
        explanation:
          title: "Manifest fetched"
          body: >-
            The manifest describes the image's configuration and its stack of
            filesystem layers. We show four conceptual layers here — a real
            nginx:latest manifest lists more, with the same mechanics.
          concept: An image is a stack of layers, not a single disk image.
        effects:
          - op: label
            component: registry
            text: "manifest: $payload.layers layers"
          - op: log
            text: "manifest fetched ($payload.layers layers)"

      - type: LAYER_PULL
        source: registry
        target: image-store
        duration: 1100
        payload:
          layerIndex: 1
          total: 4
          name: "base image (debian bookworm-slim)"
          digest: fbcc8b0e63f2
        explanation:
          title: "Pulling layer 1/4: base image"
          body: >-
            The daemon downloads the base layer — a minimal Debian root
            filesystem — as a gzipped tar blob, verifies it against the
            SHA-256 digest in the manifest, and unpacks it into the local
            content store.
          concept: Layers are cached — a second nginx pull, or any other image built on bookworm-slim, reuses this blob.
        effects: &layer-pull-effects
          - op: status
            component: image-store
            status: active
          - op: label
            component: image-store
            text: "pulling layer $payload.layerIndex/$payload.total"
          - op: push
            component: image-store
            key: layers
            value:
              layerIndex: "$payload.layerIndex"
              total: "$payload.total"
              name: "$payload.name"
              digest: "$payload.digest"
          - op: status
            component: registry
            status: active
          - op: label
            component: registry
            text: "serving blob $payload.digest"
          - op: log
            text: "$payload.digest: Pull complete"

      - type: LAYER_PULL
        source: registry
        target: image-store
        duration: 1000
        payload:
          layerIndex: 2
          total: 4
          name: "base distribution (apt packages)"
          digest: 6d3ec210a9c4
        explanation:
          title: "Pulling layer 2/4: distribution packages"
          body: >-
            Next comes the layer with apt-installed system libraries and
            utilities the server needs. It only contains the diff from the
            layer below — files added or changed by that build step.
          concept: Each layer is a diff on top of the previous one.
        effects: *layer-pull-effects

      - type: LAYER_PULL
        source: registry
        target: image-store
        duration: 1000
        payload:
          layerIndex: 3
          total: 4
          name: "nginx binaries"
          digest: 3b1aef7c2d90
        explanation:
          title: "Pulling layer 3/4: nginx binaries"
          body: >-
            The nginx binary and its shared libraries arrive as another diff
            layer. If the network drops mid-pull, already-downloaded layers
            are kept and only the missing ones are retried.
          concept: >-
            Content addressing makes pulls resumable and layers shareable
            between images.
        effects: *layer-pull-effects

      - type: LAYER_PULL
        source: registry
        target: image-store
        duration: 800
        payload:
          layerIndex: 4
          total: 4
          name: "nginx configuration"
          digest: 9f2e4a1c8b77
        explanation:
          title: "Pulling layer 4/4: configuration"
          body: >-
            The final layer adds configuration files and the entrypoint
            script. All four blobs are now stored locally, read-only, under
            /var/lib/docker. This is what "having an image" means.
          concept: Image layers are immutable and read-only — forever.
        effects: *layer-pull-effects

      - type: IMAGE_READY
        source: image-store
        target: daemon
        duration: 700
        payload:
          image: nginx:latest
        explanation:
          title: "Status: Downloaded newer image for nginx:latest"
          body: >-
            The daemon assembles the image definition from the manifest and
            marks nginx:latest available locally. The same lookup that missed
            at the start would now hit.
          concept: >-
            An image is a template: a locked, read-only stack of layers plus
            config.
        effects:
          - op: status
            component: image-store
            status: done
          - op: label
            component: image-store
            text: image ready
          - op: status
            component: registry
            status: done
          - op: label
            component: registry
          - op: label
            component: daemon
            text: "image $payload.image ready"
          - op: log
            text: "Status: Downloaded newer image for $payload.image"

      - type: CONTAINER_CREATED
        source: daemon
        target: container
        duration: 1100
        payload:
          containerId: e4f5a6b7c8
        explanation:
          title: "Container created: e4f5a6b7c8"
          body: >-
            The daemon writes the container's identity and config, and
            allocates one new thin writable layer that sits on top of the
            image's read-only layers (an overlayfs upper dir). Nothing is
            running yet — the container exists as a defined, stopped thing.
          concept: >-
            Image vs container: the image is the template; the container is
            an instance of it with its own writable layer.
        effects:
          - op: status
            component: container
            status: active
          - op: set
            component: container
            data:
              containerId: "$payload.containerId"
              writableLayer: true
          - op: push
            component: container
            key: stack
            value: { label: "base image", variant: image }
          - op: push
            component: container
            key: stack
            value: { label: "distro packages", variant: image }
          - op: push
            component: container
            key: stack
            value: { label: "nginx binaries", variant: image }
          - op: push
            component: container
            key: stack
            value: { label: "nginx config", variant: image }
          - op: push
            component: container
            key: stack
            value: { label: "writable layer (container's own)", variant: writable }
          - op: label
            component: container
            text: container created
          - op: label
            component: daemon
            text: container created
          - op: log
            text: "container $payload.containerId created (writable layer added)"

      - type: NETWORK_ATTACHED
        source: daemon
        target: container
        duration: 1000
        payload:
          network: bridge
          ip: 172.17.0.2
          veth: veth7a2b
        explanation:
          title: "Network: bridge, IP 172.17.0.2"
          body: >-
            The daemon creates a network namespace for the container and a
            virtual Ethernet pair — one end (veth7a2b) inside the container,
            the other plugged into the docker0 bridge on the host. The
            container gets IP 172.17.0.2 and reaches the outside world
            through NAT.
          concept: >-
            Container networking is real Linux networking: namespace + veth
            pair + bridge, not a simulation.
        effects:
          - op: set
            component: container
            data:
              ip: "$payload.ip"
              network: "$payload.network"
              veth: "$payload.veth"
          - op: label
            component: container
            text: "network: $payload.network"
          - op: log
            text: "connected to bridge ($payload.veth) -> $payload.ip"

      - type: PROCESS_STARTED
        source: container
        target: container
        duration: 1000
        payload:
          pid: 1
          process: "nginx: master process"
        explanation:
          title: "PID 1: nginx: master process"
          body: >-
            The container's filesystem is assembled (read-only image layers
            + writable layer), the namespaces (PID, mount, network, UTS, IPC)
            and cgroup limits are applied, and nginx is exec'd as PID 1 in
            that namespace. The master process forks workers. All of this is
            ordinary processes on the host kernel.
          concept: >-
            A container is not a miniature VM — it is a set of isolated
            processes sharing the host kernel.
        effects:
          - op: set
            component: container
            data:
              pid: "$payload.pid"
              process: "$payload.process"
          - op: label
            component: container
            text: "PID $payload.pid: $payload.process"
          - op: log
            text: "PID 1 started: $payload.process"

      - type: CONTAINER_RUNNING
        source: container
        target: terminal
        duration: 800
        payload:
          status: running
        explanation:
          title: "STATUS: Running"
          body: >-
            The daemon reports success back through the API, the CLI exits,
            and nginx is serving on port 80 inside the container. The daemon
            keeps supervising: it captures stdout, restart policies, and
            lifecycle events from here on.
          concept: >-
            The daemon stays responsible for the container's whole life —
            the CLI can exit and the container keeps running.
        effects:
          - op: status
            component: container
            status: done
          - op: set
            component: container
            data: { running: true }
          - op: label
            component: container
            text: running
          - op: status
            component: daemon
            status: done
          - op: label
            component: daemon
            text: supervising
          - op: status
            component: cli
            status: done
          - op: label
            component: cli
          - op: status
            component: terminal
            status: done
          - op: log
            text: "STATUS: Running — nginx is up"

  - id: cached
    name: Image cached
    components:
      - id: terminal
      - id: cli
      - id: daemon
      - id: registry
      - id: image-store
      - id: container
        initial: absent
    events:
      - type: COMMAND_ENTERED
        source: terminal
        target: cli
        duration: 1200
        payload:
          command: docker run nginx
        explanation:
          title: "You run: docker run nginx (again)"
          body: >-
            Second run of the same command on a machine that already has the
            image. Watch how much of the pipeline is skipped.
          concept: Same command, different path — the local store decides.
        effects:
          - op: set
            component: terminal
            data: { command: "$payload.command" }
          - op: status
            component: terminal
            status: done
          - op: status
            component: cli
            status: active
          - op: label
            component: cli
            text: parsing command
          - op: log
            text: "$ $payload.command"

      - type: CLI_REQUEST
        source: cli
        target: daemon
        duration: 1000
        payload:
          method: POST
          path: /v1.47/containers/create
        explanation:
          title: "The CLI calls the daemon's HTTP API"
          body: >-
            Identical to the first run: the CLI sends the create request
            over the Unix socket. The daemon, not the CLI, decides what
            happens next.
          concept: The client/server split never changes.
        effects:
          - op: status
            component: cli
            status: active
          - op: label
            component: cli
            text: "$payload.method $payload.path"
          - op: status
            component: daemon
            status: active
          - op: label
            component: daemon
            text: handling API request
          - op: log
            text: "cli -> daemon: $payload.method $payload.path"

      - type: IMAGE_LOOKUP
        source: daemon
        target: image-store
        duration: 900
        payload:
          image: nginx:latest
        explanation:
          title: The daemon looks for the image locally
          body: >-
            The daemon checks the local content store for nginx:latest —
            exactly the same lookup as before.
          concept: The lookup is the branch point of docker run.
        effects:
          - op: status
            component: daemon
            status: active
          - op: label
            component: daemon
            text: "checking local image store…"
          - op: status
            component: image-store
            status: active
          - op: log
            text: "daemon: looking for image locally"

      - type: IMAGE_HIT
        source: image-store
        target: daemon
        duration: 700
        payload:
          reason: found
        explanation:
          title: "Image found in the local store"
          body: >-
            The image's layers are already on disk from the earlier pull, so
            the registry is never contacted. No bytes move over the network;
            creation starts immediately.
          concept: Layer caching is what makes repeat runs fast.
        effects:
          - op: status
            component: image-store
            status: done
          - op: label
            component: daemon
            text: image found locally
          - op: log
            text: "Image nginx:latest found in local store"

      - type: CONTAINER_CREATED
        source: daemon
        target: container
        duration: 1100
        payload:
          containerId: b9c8d7e6f5
        explanation:
          title: "Container created: b9c8d7e6f5"
          body: >-
            A new container ID, a new thin writable layer on the same
            read-only image layers. Two containers from one image share every
            image layer and diverge only in their writable tops.
          concept: One image, many containers — each with its own writable layer.
        effects:
          - op: status
            component: container
            status: active
          - op: set
            component: container
            data:
              containerId: "$payload.containerId"
              writableLayer: true
          - op: push
            component: container
            key: stack
            value: { label: "base image", variant: image }
          - op: push
            component: container
            key: stack
            value: { label: "distro packages", variant: image }
          - op: push
            component: container
            key: stack
            value: { label: "nginx binaries", variant: image }
          - op: push
            component: container
            key: stack
            value: { label: "nginx config", variant: image }
          - op: push
            component: container
            key: stack
            value: { label: "writable layer (container's own)", variant: writable }
          - op: label
            component: container
            text: container created
          - op: label
            component: daemon
            text: container created
          - op: log
            text: "container $payload.containerId created (writable layer added)"

      - type: NETWORK_ATTACHED
        source: daemon
        target: container
        duration: 1000
        payload:
          network: bridge
          ip: 172.17.0.3
          veth: veth9f31
        explanation:
          title: "Network: bridge, IP 172.17.0.3"
          body: >-
            A fresh network namespace and veth pair; the bridge hands out the
            next free address. Both containers are on docker0 and can talk to
            each other by IP.
          concept: Every container gets its own network namespace and IP.
        effects:
          - op: set
            component: container
            data:
              ip: "$payload.ip"
              network: "$payload.network"
              veth: "$payload.veth"
          - op: label
            component: container
            text: "network: $payload.network"
          - op: log
            text: "connected to bridge ($payload.veth) -> $payload.ip"

      - type: PROCESS_STARTED
        source: container
        target: container
        duration: 1000
        payload:
          pid: 1
          process: "nginx: master process"
        explanation:
          title: "PID 1: nginx: master process"
          body: >-
            Namespaces, cgroups, assembled filesystem — then nginx starts as
            PID 1 in the new container, isolated from the first one.
          concept: Isolation comes from namespaces and cgroups, one set per container.
        effects:
          - op: set
            component: container
            data:
              pid: "$payload.pid"
              process: "$payload.process"
          - op: label
            component: container
            text: "PID $payload.pid: $payload.process"
          - op: log
            text: "PID 1 started: $payload.process"

      - type: CONTAINER_RUNNING
        source: container
        target: terminal
        duration: 800
        payload:
          status: running
        explanation:
          title: "STATUS: Running"
          body: >-
            Done — and noticeably faster, because the entire pull phase was
            skipped by a cache hit.
          concept: Cached layers + local creation = sub-second starts.
        effects:
          - op: status
            component: container
            status: done
          - op: set
            component: container
            data: { running: true }
          - op: label
            component: container
            text: running
          - op: status
            component: daemon
            status: done
          - op: label
            component: daemon
            text: supervising
          - op: status
            component: cli
            status: done
          - op: label
            component: cli
          - op: status
            component: terminal
            status: done
          - op: log
            text: "STATUS: Running — nginx is up"
