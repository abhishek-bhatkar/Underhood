scenarios:
  - id: resolve
    name: Resolve request
    components:
      - id: client
      - id: lb
      - id: api
        initial: absent
      - id: cache
        initial: absent
      - id: db
      - id: replica
    events:
      - type: REQUEST
        source: client
        target: lb
        duration: 800
        payload:
          url: "sho.rt/abc123"
        explanation:
          title: "A request arrives: sho.rt/abc123"
          body: >-
            A user's browser asks the shortener to resolve abc123. Traffic
            arrives at the load balancer - the fixed front door that hides
            how many API instances exist behind it.
          concept: "The load balancer decouples clients from topology: users see one name, you run N servers."
        effects:
          - op: set
            component: client
            data: { url: "$payload.url", command: "GET $payload.url" }
          - op: status
            component: client
            status: active
          - op: status
            component: lb
            status: active
          - op: label
            component: lb
            text: "10k req/s incoming"
          - op: log
            text: "GET $payload.url"

      - type: LB_ROUTES
        source: lb
        target: api
        duration: 800
        explanation:
          title: "LB picks api-2 (least connections)"
          body: >-
            The balancer routes by least-open-connections - api-1 and api-3
            are busier - and forwards the request. Any instance can serve
            any request: they're stateless equals.
          concept: "Horizontal scaling needs interchangeable servers: state lives elsewhere (cache, DB) so any node can serve."
        effects:
          - op: status
            component: api
            status: active
          - op: push
            component: api
            key: instances
            value: { label: "api-2: resolving abc123" }
          - op: label
            component: api
            text: "api-2 handling request"
          - op: log
            text: "lb: -> api-2"

      - type: CACHE_LOOKUP
        source: api
        target: cache
        duration: 800
        explanation:
          title: "Check the cache first"
          body: >-
            Before touching the database, api-2 looks up abc123 in Redis.
            Hot short codes get millions of hits; caching them is the
            difference between 2ms and 45ms per resolve.
          concept: "Cache-aside: check the cache, fall through to the DB on miss, fill the cache after."
        effects:
          - op: status
            component: cache
            status: active
          - op: label
            component: cache
            text: "GET abc123"
          - op: log
            text: "cache: GET abc123"

      - type: CACHE_MISS
        source: cache
        target: api
        duration: 700
        explanation:
          title: "Cache MISS"
          body: >-
            Nobody has requested abc123 recently, so the key has expired.
            api-2 must ask the source of truth - this is the slow path
            every cache exists to avoid.
          concept: "A miss costs cache + DB latency; a hit costs cache only. Hit rate is the metric."
        effects:
          - op: label
            component: cache
            text: "MISS (expired)"
          - op: label
            component: api
            text: "miss -> querying db"
          - op: log
            text: "cache: MISS"

      - type: DB_QUERY
        source: api
        target: db
        duration: 900
        explanation:
          title: "Database: index lookup on code"
          body: >-
            The primary runs an indexed lookup - code is the primary key -
            and finds the row in one B-tree descent, with the replica
            shadowing reads it isn't needed for here.
          concept: "The DB is the bottleneck of last resort: indexes + cache keep it out of the hot path."
        effects:
          - op: status
            component: db
            status: active
          - op: push
            component: db
            key: rows
            value: { label: "abc123 -> https://example.com/a-very-long-url" }
          - op: label
            component: db
            text: "1 row (index scan)"
          - op: log
            text: "db: abc123 -> example.com (45ms)"

      - type: CACHE_FILL
        source: db
        target: cache
        duration: 800
        payload:
          ttl: 300
        explanation:
          title: "Cache filled (TTL 300s)"
          body: >-
            api-2 writes the mapping back to the cache with a TTL. For the
            next five minutes, every request for abc123 stops here - the
            database never hears about them.
          concept: "One DB read amortizes into thousands of cache hits - that's the cache's whole business case."
        effects:
          - op: push
            component: cache
            key: entries
            value: { label: "abc123 -> example.com (ttl $payload.ttl)" }
          - op: label
            component: cache
            text: "SET abc123 (ttl $payload.ttl)"
          - op: log
            text: "cache: filled (ttl $payload.ttl)"

      - type: REDIRECT
        source: api
        target: client
        duration: 800
        explanation:
          title: "302 → the long URL"
          body: >-
            api-2 answers with a redirect to the long URL and the browser
            follows it. Total: ~50ms, most of it the one database read.
          concept: "Shorteners are read-heavy: redirects dominate, which is why caching wins."
        effects:
          - op: status
            component: db
            status: done
          - op: label
            component: client
            text: "302 -> example.com ✓"
          - op: log
            text: "302 Location: https://example.com/…"

      - type: SECOND_REQUEST
        source: client
        target: lb
        duration: 800
        explanation:
          title: "Another request for the same code"
          body: >-
            A different user hits the same short link moments later. Same
            door, same routing - but the next hop is about to be much
            shorter.
          concept: "Popularity is skewed: a few codes take most traffic, which is exactly what caches exploit."
        effects:
          - op: set
            component: client
            data: { command: "GET sho.rt/abc123 (again)" }
          - op: label
            component: lb
            text: "-> api-1 this time"
          - op: log
            text: "GET sho.rt/abc123 (again)"

      - type: CACHE_HIT
        source: cache
        target: api
        duration: 800
        explanation:
          title: "Cache HIT - 2ms"
          body: >-
            api-1 finds abc123 in the cache and answers directly. No
            database query, no extra latency: the request completed before
            the slow path would have reached the DB.
          concept: "The cache turns a 45ms read into a 2ms read - capacity you didn't buy, you borrowed."
        effects:
          - op: label
            component: cache
            text: "HIT (2ms)"
          - op: label
            component: api
            text: "hit -> respond"
          - op: log
            text: "cache: HIT - 2ms, no db query"

      - type: SETTLED
        source: api
        target: client
        duration: 700
        explanation:
          title: "Steady state: cache absorbing traffic"
          body: >-
            With a healthy hit rate, the database sees only cold traffic
            while the cache takes the heat. Every piece played its role:
            LB for fan-out, cache for speed, DB for truth, replica for
            survival.
          concept: "Availability and latency are architecture outcomes: each layer here exists to remove a bottleneck."
        effects:
          - op: status
            component: client
            status: done
          - op: status
            component: lb
            status: done
          - op: status
            component: api
            status: done
          - op: status
            component: cache
            status: done
          - op: status
            component: replica
            status: done
          - op: label
            component: replica
            text: "replicating writes"
          - op: log
            text: "steady state - cache hit rate ~97%"

  - id: db-failure
    name: Database failure
    components:
      - id: client
      - id: lb
      - id: api
        initial: absent
      - id: cache
        initial: absent
      - id: db
      - id: replica
    events:
      - type: REQUEST
        source: client
        target: lb
        duration: 800
        payload:
          url: "sho.rt/abc123"
        explanation:
          title: "Fast-forward: system under load"
          body: >-
            Same architecture, steady traffic, healthy cache hit rate -
            until the primary database stops answering.
          concept: "Failure scenarios start from the architecture you already trust."
        effects:
          - op: set
            component: client
            data: { url: "$payload.url", command: "GET $payload.url" }
          - op: status
            component: client
            status: active
          - op: status
            component: lb
            status: done
          - op: label
            component: lb
            text: "10k req/s incoming"
          - op: status
            component: api
            status: active
          - op: push
            component: api
            key: instances
            value: { label: "api-2: resolving abc123" }
          - op: label
            component: api
            text: "api-2 handling request"
          - op: status
            component: cache
            status: done
          - op: push
            component: cache
            key: entries
            value: { label: "abc123 -> example.com (ttl 300)" }
          - op: label
            component: cache
            text: "MISS - expired"
          - op: status
            component: replica
            status: done
          - op: label
            component: replica
            text: "replicating writes"
          - op: log
            text: "GET $payload.url - cache MISS"

      - type: DB_DIES
        source: api
        target: db
        duration: 900
        explanation:
          title: "Primary database: unreachable"
          body: >-
            The primary's host dies mid-request. api-2's query hangs until
            its driver timeout fires - connection refused. Every request
            that misses the cache is now heading for the same wall.
          concept: "A dead dependency doesn't fail fast by itself - timeouts make failure observable."
        effects:
          - op: status
            component: db
            status: error
          - op: label
            component: db
            text: "unreachable"
          - op: status
            component: api
            status: error
          - op: label
            component: api
            text: "connection timeout (2s)"
          - op: log
            text: "db: connection refused"

      - type: ERRORS_CLIMB
        source: api
        target: lb
        duration: 900
        explanation:
          title: "Error rate spikes"
          body: >-
            Cache misses pile up behind the dead primary and api instances
            start returning 5xx. Users see failures; monitoring pages the
            on-call. The LB can't help - every backend has the same sick
            dependency.
          concept: "Redundant servers don't fix a dead shared dependency - the DB is a single point of failure until failover."
        effects:
          - op: status
            component: lb
            status: error
          - op: label
            component: lb
            text: "5xx rate climbing"
          - op: label
            component: api
            text: "5xx: upstream db down"
          - op: log
            text: "api: 5xx spike (db unavailable)"

      - type: BREAKER_OPENS
        source: api
        target: api
        duration: 900
        explanation:
          title: "Circuit breaker opens"
          body: >-
            After enough failures, each api instance's circuit breaker
            opens: calls to the DB fail fast - in milliseconds, not
            seconds - freeing threads and letting the LB health-check
            instead of drowning. Failing fast is a feature.
          concept: "A circuit breaker converts slow failure into fast failure - protecting the rest of the system."
        effects:
          - op: status
            component: api
            status: active
          - op: label
            component: api
            text: "breaker OPEN: fail fast"
          - op: log
            text: "breaker: open - db calls fail fast"

      - type: FAILOVER
        source: db
        target: replica
        duration: 1000
        explanation:
          title: "Replica promoted to primary"
          body: >-
            The automation (or the on-call) promotes the replica: it has
            the replicated data, minus the last unreplicated writes.
            Connection strings flip via service discovery and the breakers
            start half-open probes.
          concept: "Replication buys failover: minutes of risk for a lifetime of durability."
        effects:
          - op: status
            component: replica
            status: active
          - op: set
            component: replica
            data: { role: primary }
          - op: label
            component: replica
            text: "promoted to primary"
          - op: label
            component: db
            text: "dead (to be replaced)"
          - op: status
            component: db
            status: done
          - op: log
            text: "failover: replica promoted"

      - type: RECOVERED
        source: api
        target: client
        duration: 900
        explanation:
          title: "Breaker closes - 200s again"
          body: >-
            Half-open probes succeed against the new primary, the breakers
            close, and the 5xx rate falls back to zero. The old primary's
            host will rejoin later as a replica. Notice the cache kept
            serving hits throughout - hot traffic never noticed.
          concept: "Recovery is staged: fail fast, promote, probe, reopen - and the cache shielded most users throughout."
        effects:
          - op: status
            component: api
            status: done
          - op: label
            component: api
            text: "breaker CLOSED: healthy"
          - op: status
            component: lb
            status: done
          - op: label
            component: lb
            text: "5xx back to 0%"
          - op: status
            component: replica
            status: done
          - op: status
            component: client
            status: done
          - op: label
            component: client
            text: "302s restored ✓"
          - op: log
            text: "recovered - cache hits never stopped"
