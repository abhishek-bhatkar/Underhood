concepts:
  terminal:
    name: Terminal (client)
    summary: "Your application's edge - here a CLI producing one record."
    fields:
      - { key: command, label: command }
    details:
      - "In production this is your service calling a producer library, not a shell."
      - "The client library owns serialization, partitioning, batching, retries."

  producer:
    name: Producer
    summary: "Client-side library that partitions, batches, and acknowledges records."
    fields:
      - { key: key, label: key }
      - { key: acks, label: acks }
    details:
      - "Keys hash to a partition - same key, same partition, per-key order."
      - "acks=0/1/all trade latency vs durability; all waits for the full ISR."
      - "Retries + idempotence prevent duplicates when a broker dies mid-ack."

  topic:
    name: "Topic: orders"
    summary: "A named stream, split into partitions for parallelism."
    details:
      - "Partitions are the unit of scale: more partitions, more parallel writers/readers."
      - "Ordering holds within a partition, never across partitions."
      - "Topics are logical: their partitions are spread over brokers."

  broker-1:
    name: Broker 1
    summary: "A Kafka server; leader of partition P1 here."
    fields:
      - { key: role, label: role }
      - { key: hw, label: high watermark }
      - { key: log, label: log, list: true }
    details:
      - "A leader accepts appends and serves fetches for its partition."
      - "The high watermark is the highest offset visible to consumers."
      - "Brokers are homogeneous - any broker can lead any partition."

  broker-2:
    name: Broker 2
    summary: "A Kafka server; follower replica of P1, later its leader."
    fields:
      - { key: role, label: role }
      - { key: log, label: log, list: true }
    details:
      - "Followers fetch from the leader and maintain an identical log."
      - "In-sync replicas (ISR) are eligible for leadership."
      - "Failover promotes an ISR follower - order and data continue."

  broker-3:
    name: Broker 3
    summary: "A Kafka server; follower of P1 and the cluster controller here."
    fields:
      - { key: role, label: role }
      - { key: log, label: log, list: true }
    details:
      - "One broker acts as controller, handling leader elections."
      - "The controller only promotes in-sync replicas."

  consumer-group:
    name: "Consumer group: billing"
    summary: "A set of consumers sharing the work of reading a topic."
    fields:
      - { key: consumers, label: consumers }
      - { key: position, label: position }
    details:
      - "Each partition is assigned to exactly one consumer in the group."
      - "Groups are independent: every group reads the whole topic."
      - "Members joining/leaving trigger a rebalance - a reassignment of partitions."

  offsets:
    name: Committed offsets
    summary: "The group's checkpoints, stored in an internal Kafka topic."
    fields:
      - { key: committed, label: commits, list: true }
    details:
      - "A commit records the next offset to read per partition."
      - "Crash recovery resumes from the last commit - at-least-once by default."
      - "The offsets topic is itself replicated like any other topic."
